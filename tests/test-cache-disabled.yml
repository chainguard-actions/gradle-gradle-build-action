name: Test Gradle setup with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
          dependency-graph: 'disabled'
          add-job-summary: 'never'

      - name: Assert gradle-version output is set when cache is disabled
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action not resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Gradle is functional with cache disabled (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Running gradle --version to verify Gradle works..."
            OUTPUT=$(gradle --version 2>&1)
            echo "$OUTPUT"
            if ! echo "$OUTPUT" | grep -qi "gradle"; then
              echo "FAIL: gradle --version did not produce expected output"
              exit 1
            fi
            echo "PASS: Gradle is functional with cache disabled"
          else
            echo "PASS: skipping Gradle functional check (action did not succeed)"
          fi
