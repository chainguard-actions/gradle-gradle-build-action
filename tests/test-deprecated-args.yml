name: Test deprecated arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gradle-test-project"
          cd "$GITHUB_WORKSPACE/gradle-test-project"
          cat > settings.gradle << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'base'
          }
          EOF
      - id: action
        uses: .
        with:
          cache-disabled: 'true'
          gradle-version: 'current'
          build-root-directory: 'gradle-test-project'
          arguments: 'help'
          artifact-retention-days: '1'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version=$GRADLE_VERSION"
