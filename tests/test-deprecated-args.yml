name: Test deprecated arguments and artifact-retention-days inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/gradle/wrapper"
          cat > "$GITHUB_WORKSPACE/test-project/settings.gradle" <<'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/test-project/build.gradle" <<'EOF'
          plugins {
              id 'base'
          }
          EOF
          # Use a known Gradle wrapper jar checksum (Gradle 8.7)
          cat > "$GITHUB_WORKSPACE/test-project/gradle/wrapper/gradle-wrapper.properties" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
      - id: action
        uses: .
        with:
          cache-disabled: 'true'
          artifact-retention-days: '5'
          build-root-directory: 'test-project'
          arguments: 'help'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS"
