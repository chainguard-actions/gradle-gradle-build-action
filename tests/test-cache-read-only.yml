name: Test cache read-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-read-only: 'true'
          cache-disabled: 'false'
        continue-on-error: true

      - name: Assert action ran in cache-read-only mode
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            if echo "$GRADLE_VERSION" | grep -q "8.7"; then
              echo "PASS: gradle-version '$GRADLE_VERSION' contains expected version 8.7 in cache-read-only mode"
            else
              echo "FAIL: expected gradle-version to contain '8.7', got '$GRADLE_VERSION'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action may not be resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
