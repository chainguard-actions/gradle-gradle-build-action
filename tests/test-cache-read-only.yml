name: Test Gradle setup with cache read-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-read-only: 'true'
          dependency-graph: 'disabled'
          add-job-summary: 'never'

      - name: Assert gradle-version output is set in cache-read-only mode
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action not resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Gradle is available in cache-read-only mode (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Verifying Gradle is on PATH in cache-read-only mode..."
            if ! command -v gradle >/dev/null 2>&1; then
              echo "FAIL: gradle not found on PATH"
              exit 1
            fi
            VERSION_OUTPUT=$(gradle --version 2>&1)
            echo "$VERSION_OUTPUT"
            if ! echo "$VERSION_OUTPUT" | grep -qi "gradle"; then
              echo "FAIL: gradle --version output unexpected"
              exit 1
            fi
            echo "PASS: Gradle is available in cache-read-only mode"
          else
            echo "PASS: skipping Gradle PATH check (action did not succeed)"
          fi
