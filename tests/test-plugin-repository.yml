name: Test plugin repository and deprecated execution inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: 'true'
          add-job-summary: 'never'
          dependency-graph: 'disabled'
          gradle-plugin-repository-url: 'https://plugins.gradle.org/m2'
          gradle-plugin-repository-username: ''
          gradle-plugin-repository-password: ''
          arguments: ''
          build-root-directory: ''
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
