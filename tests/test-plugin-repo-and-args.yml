name: Test plugin repository and deprecated arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: "8.8"
          cache-disabled: "true"
          gradle-plugin-repository-url: "https://plugins.gradle.org/m2"
          gradle-plugin-repository-username: ""
          gradle-plugin-repository-password: ""
          arguments: "--version"
          build-root-directory: "."
          add-job-summary: "never"
          add-job-summary-as-pr-comment: "never"
          dependency-graph: "disabled"
          validate-wrappers: "false"
      - name: Assert gradle-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "actual gradle-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected gradle-version output to be non-empty"
            exit 1
          fi
          echo "PASS: gradle-version=$ACTUAL"
