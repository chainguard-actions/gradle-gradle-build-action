name: Test deprecated action inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: true
          arguments: '--version'
          build-root-directory: '.'
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with deprecated arguments and build-root-directory inputs"
