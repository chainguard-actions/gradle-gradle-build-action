name: Test build scan and cache encryption inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
          cache-encryption-key: 'dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdA=='
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          add-job-summary: 'never'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
