name: Test basic usage with gradle-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: '8.8'
          cache-disabled: 'true'
          gradle-home-cache-excludes: |
            caches/build-cache-*
          artifact-retention-days: '7'
          cache-encryption-key: ''
          add-job-summary: 'never'
          dependency-graph: 'disabled'
      - name: Assert gradle-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "actual gradle-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected gradle-version output to be non-empty"
            exit 1
          fi
          echo "PASS"
