name: Test basic usage with gradle-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: true
          cache-read-only: false
          cache-write-only: false
          cache-overwrite-existing: false
          cache-encryption-key: ''
          gradle-home-cache-excludes: 'wrapper/dists'
          gradle-home-cache-cleanup: false
          add-job-summary: 'always'
          add-job-summary-as-pr-comment: 'never'
          dependency-graph: 'disabled'
          dependency-graph-continue-on-failure: true
          artifact-retention-days: '5'
          build-scan-publish: false
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          validate-wrappers: false
          gradle-home-cache-strict-match: false
          generate-job-summary: true
      - name: Assert gradle-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "actual gradle-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected gradle-version output to be non-empty"
            exit 1
          fi
          echo "PASS: gradle-version output is '$ACTUAL'"
