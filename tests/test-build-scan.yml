name: Test build scan and cache encryption inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: "8.8"
          cache-disabled: "true"
          cache-encryption-key: "dGVzdGtleWZvcmVuY3J5cHRpb24="
          artifact-retention-days: "7"
          build-scan-publish: "false"
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          build-scan-terms-of-service-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-service-agree: "yes"
          add-job-summary: "never"
          add-job-summary-as-pr-comment: "never"
          dependency-graph: "disabled"
          validate-wrappers: "false"
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with build-scan and cache-encryption inputs"
