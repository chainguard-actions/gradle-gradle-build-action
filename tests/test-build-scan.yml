name: Test build scan and develocity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: 'true'
          add-job-summary: 'never'
          dependency-graph: 'disabled'
          build-scan-publish: 'false'
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
          build-scan-terms-of-service-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-service-agree: 'yes'
          develocity-access-key: ''
          develocity-token-expiry: '2'
          develocity-injection-enabled: 'false'
          develocity-url: ''
          develocity-allow-untrusted-server: 'false'
          develocity-capture-file-fingerprints: 'false'
          develocity-enforce-url: 'false'
          develocity-plugin-version: ''
          develocity-ccud-plugin-version: ''
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
