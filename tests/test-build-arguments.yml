name: Test build arguments configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up minimal Gradle project
        run: |
          mkdir -p /tmp/gradle-test-project
          cat > /tmp/gradle-test-project/build.gradle << 'EOF'
          // Minimal Gradle build file
          task hello {
            doLast {
              println 'Hello from Gradle!'
            }
          }
          EOF
          cat > /tmp/gradle-test-project/settings.gradle << 'EOF'
          rootProject.name = 'test-project'
          EOF
      - id: action
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          build-root-directory: '/tmp/gradle-test-project'
          arguments: 'hello'
          artifact-retention-days: '1'
      - name: Assert action completed successfully
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: expected gradle-version output to be set"
            exit 1
          fi
          echo "PASS: action completed with arguments, build-root-directory, and artifact-retention-days set"
