name: Test deprecated arguments and build-root-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cat > "$GITHUB_WORKSPACE/test-project/settings.gradle" << 'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/test-project/build.gradle" << 'EOF'
          plugins {
              id 'base'
          }
          EOF
      - id: action
        uses: .
        with:
          gradle-version: '8.5'
          cache-disabled: true
          build-root-directory: test-project
          arguments: 'help'
          dependency-graph: 'disabled'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version is '$GRADLE_VERSION'"
