name: Test deprecated arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Gradle wrapper project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gradle-test-project/gradle/wrapper"
          cat > "$GITHUB_WORKSPACE/gradle-test-project/settings.gradle" <<'EOF'
          rootProject.name = 'test-project'
          EOF
          cat > "$GITHUB_WORKSPACE/gradle-test-project/build.gradle" <<'EOF'
          // minimal build file
          EOF
          # Use gradle-version input instead of wrapper to avoid needing a real wrapper
      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
          artifact-retention-days: '1'
          build-root-directory: 'gradle-test-project'
          arguments: '--version'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS"
