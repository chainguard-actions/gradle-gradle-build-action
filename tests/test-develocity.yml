name: Test develocity and plugin repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: true
          develocity-access-key: ''
          develocity-token-expiry: '2'
          develocity-injection-enabled: 'false'
          develocity-url: ''
          develocity-allow-untrusted-server: 'false'
          develocity-capture-file-fingerprints: 'false'
          develocity-enforce-url: 'false'
          develocity-plugin-version: ''
          develocity-ccud-plugin-version: ''
          gradle-plugin-repository-url: ''
          gradle-plugin-repository-username: ''
          gradle-plugin-repository-password: ''
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with develocity inputs"
