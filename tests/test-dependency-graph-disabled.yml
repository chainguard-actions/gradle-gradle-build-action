name: Test dependency graph disabled (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
          dependency-graph: 'disabled'
      - name: Assert gradle-version output is set or action failed gracefully
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          DEP_GRAPH_FILE: ${{ steps.action.outputs.dependency-graph-file }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          echo "dependency-graph-file: '$DEP_GRAPH_FILE'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
            echo "INFO: dependency-graph-file='$DEP_GRAPH_FILE' (expected empty when disabled)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action may not be resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
