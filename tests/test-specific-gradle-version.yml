name: Test specific Gradle version setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.5'
          cache-disabled: 'true'
      - name: Assert gradle-version output matches requested version or action failed gracefully
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            if [ "$GRADLE_VERSION" != "8.5" ]; then
              echo "FAIL: expected gradle-version '8.5' but got '$GRADLE_VERSION'"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action may not be resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert correct gradle version is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            ACTUAL_VERSION=$(gradle --version 2>/dev/null | grep '^Gradle ' | awk '{print $2}')
            echo "actual gradle version: $ACTUAL_VERSION"
            if [ "$ACTUAL_VERSION" != "8.5" ]; then
              echo "FAIL: expected gradle 8.5 but got '$ACTUAL_VERSION'"
              exit 1
            fi
            echo "PASS: gradle version is $ACTUAL_VERSION"
          else
            echo "SKIP: action did not succeed, skipping gradle version check"
          fi
