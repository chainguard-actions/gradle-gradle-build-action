name: Test Develocity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
          add-job-summary: 'never'
          develocity-access-key: ''
          develocity-token-expiry: '2'
          develocity-injection-enabled: 'false'
          develocity-url: 'https://develocity.example.com'
          develocity-allow-untrusted-server: 'false'
          develocity-capture-file-fingerprints: 'false'
          develocity-enforce-url: 'false'
          develocity-plugin-version: ''
          develocity-ccud-plugin-version: ''
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
