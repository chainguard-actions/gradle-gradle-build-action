name: Test advanced cache configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate encryption key
        id: gen-key
        run: |
          KEY=$(openssl rand -base64 16)
          echo "key=$KEY" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        with:
          cache-disabled: 'true'
          cache-encryption-key: ${{ steps.gen-key.outputs.key }}
          gradle-home-cache-excludes: |
            caches/build-cache-*
            caches/transforms-*
      - name: Assert action completed
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version output: $GRADLE_VERSION"
          echo "PASS: action completed with cache-encryption-key and gradle-home-cache-excludes"
