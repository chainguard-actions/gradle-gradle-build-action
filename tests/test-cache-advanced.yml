name: Test advanced cache configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: 'true'
          cache-encryption-key: 'dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3OA=='
          gradle-home-cache-excludes: |
            caches/build-cache-*
            caches/keyrings
      - name: Assert action completed successfully
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          echo "PASS: action completed with cache-encryption-key and gradle-home-cache-excludes set"
