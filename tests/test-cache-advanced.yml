name: Test advanced cache configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-disabled: false
          cache-read-only: true
          cache-encryption-key: 'dGVzdGtleWZvcmVuY3J5cHRpb24xMjM0NQ=='
          gradle-home-cache-includes: |
            caches
            notifications
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1
          dependency-graph: 'disabled'
      - name: Assert gradle-version output is set
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
        run: |
          echo "gradle-version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "FAIL: gradle-version output is empty"
            exit 1
          fi
          echo "PASS: gradle-version is '$GRADLE_VERSION'"
