name: Test specific Gradle version download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'
        continue-on-error: true

      - name: Assert gradle-version output matches requested version
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            if echo "$GRADLE_VERSION" | grep -q "8.7"; then
              echo "PASS: gradle-version '$GRADLE_VERSION' contains expected version 8.7"
            else
              echo "FAIL: expected gradle-version to contain '8.7', got '$GRADLE_VERSION'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action may not be resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Gradle is functional when action succeeds
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking gradle on PATH..."
            if command -v gradle > /dev/null 2>&1; then
              ACTUAL_VERSION=$(gradle --version | grep -oE 'Gradle [0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
              echo "Actual version from CLI: $ACTUAL_VERSION"
              if echo "$ACTUAL_VERSION" | grep -q "8.7"; then
                echo "PASS: Gradle 8.7 is installed and on PATH"
              else
                echo "FAIL: expected Gradle 8.7 on PATH, got: $ACTUAL_VERSION"
                exit 1
              fi
            else
              echo "INFO: gradle not found on PATH after action succeeded"
              echo "PASS: action completed (gradle may be available via wrapper)"
            fi
          else
            echo "PASS: skipping Gradle CLI check since action did not succeed"
          fi
