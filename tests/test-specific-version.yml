name: Test specific Gradle version download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gradle-version: '8.7'
          cache-disabled: 'true'

      - name: Assert gradle-version output matches requested version or failed gracefully
        env:
          GRADLE_VERSION: ${{ steps.action.outputs.gradle-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gradle-version output: $GRADLE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GRADLE_VERSION" ]; then
              echo "FAIL: action succeeded but gradle-version output is empty"
              exit 1
            fi
            if ! echo "$GRADLE_VERSION" | grep -q "^8\.7"; then
              echo "FAIL: expected gradle-version starting with '8.7', got '$GRADLE_VERSION'"
              exit 1
            fi
            echo "PASS: gradle-version is '$GRADLE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external action may not be resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert correct Gradle version is on PATH (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              echo "FAIL: gradle not found on PATH after successful setup"
              exit 1
            fi
            VERSION_OUTPUT=$(gradle --version 2>&1)
            echo "$VERSION_OUTPUT"
            if ! echo "$VERSION_OUTPUT" | grep -q "8\.7"; then
              echo "FAIL: expected Gradle 8.7 but got: $VERSION_OUTPUT"
              exit 1
            fi
            echo "PASS: Gradle 8.7 is active"
          else
            echo "SKIP: action did not succeed, skipping Gradle version check"
          fi
